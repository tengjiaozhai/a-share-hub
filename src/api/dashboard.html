<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股自动交易系统 - 工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#334155;
  --fg:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
  --accent:#60a5fa;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#eab308;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}

/* ── STATUS BAR ── */
.status-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:8px 20px;display:flex;align-items:center;gap:16px;font-size:13px;flex-wrap:wrap;
}
.status-bar .brand{font-size:15px;font-weight:700;color:var(--accent);margin-right:8px}
.status-bar .sep{width:1px;height:16px;background:var(--border)}
.status-bar .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.status-bar .pill.mode{background:rgba(34,197,94,.2);color:var(--green)}
.status-bar .pill.ok{background:rgba(34,197,94,.15);color:var(--green)}
.status-bar .pill.warn{background:rgba(234,179,8,.15);color:var(--yellow)}
.status-bar .pill.err{background:rgba(239,68,68,.15);color:var(--red)}
.status-bar .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.status-bar .dot.g{background:var(--green)}.status-bar .dot.y{background:var(--yellow)}.status-bar .dot.r{background:var(--red)}
.status-bar .kill-btn{
  margin-left:auto;background:var(--red);color:#fff;border:none;padding:4px 14px;
  border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;
}
.status-bar .kill-btn:hover{background:#dc2626}
.status-bar .nav-group{display:flex;gap:0;background:var(--bg);border-radius:6px;padding:2px}
.status-bar .nav-group button{
  padding:5px 14px;border:none;border-radius:4px;font-size:12px;font-weight:600;
  cursor:pointer;background:transparent;color:var(--muted);transition:.15s;white-space:nowrap;
}
.status-bar .nav-group button.active{background:var(--blue);color:#fff}
.status-bar .nav-group button:hover:not(.active){color:var(--fg)}

/* ── MAIN LAYOUT ── */
.main{display:grid;grid-template-columns:280px 1fr 280px;grid-template-rows:1fr auto;gap:0;min-height:calc(100vh - 40px)}

/* ── LEFT PANEL ── */
.panel-left{
  background:var(--surface);border-right:1px solid var(--border);padding:16px;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;
}
.panel-left h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--dim);font-weight:500}
.field input,.field select,.field textarea{
  background:var(--bg);border:1px solid var(--border);color:var(--fg);
  padding:8px 10px;border-radius:6px;font-size:13px;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.toggle-row span{font-size:13px;color:var(--muted)}
.toggle{
  width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;cursor:pointer;transition:.2s;
}
.toggle.on{background:var(--green)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  background:#fff;border-radius:50%;transition:.2s;
}
.toggle.on::after{left:18px}
.run-btn{
  background:var(--blue);color:#fff;border:none;padding:12px;border-radius:8px;
  font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:.15s;
}
.run-btn:hover{background:#2563eb}
.run-btn:disabled{opacity:.5;cursor:not-allowed}
.save-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;transition:.15s;
}
.save-btn:hover{color:var(--fg);border-color:var(--accent)}
.save-btn:active{transform:scale(.97)}

/* ── CENTER PANEL ── */
.panel-center{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.panel-center h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.timeline{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;flex:1;overflow-y:auto;min-height:300px;
}
.timeline-empty{
  display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--dim);font-size:14px;
}
.tl-step{
  border-left:2px solid var(--border);padding:0 0 16px 16px;position:relative;
}
.tl-step:last-child{border-left-color:transparent;padding-bottom:0}
.tl-step::before{
  content:'';position:absolute;left:-6px;top:2px;width:10px;height:10px;
  border-radius:50%;background:var(--border);border:2px solid var(--bg);
}
.tl-step.done::before{background:var(--green)}
.tl-step.running::before{background:var(--yellow);animation:pulse 1s infinite}
.tl-step.error::before{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tl-step .step-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tl-step .step-tag{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;
}
.tl-step .step-tag.decision{background:rgba(96,165,250,.2);color:var(--accent)}
.tl-step .step-tag.target{background:rgba(34,197,94,.15);color:var(--green)}
.tl-step .step-tag.execute{background:rgba(234,179,8,.15);color:var(--yellow)}
.tl-step .step-tag.reconcile{background:rgba(139,92,246,.2);color:#a78bfa}
.tl-step .step-time{font-size:11px;color:var(--dim)}
.tl-step .step-body{font-size:13px;color:var(--muted);line-height:1.6}
.tl-step .step-body table{width:100%;border-collapse:collapse;margin-top:6px}
.tl-step .step-body th,.tl-step .step-body td{
  padding:4px 8px;text-align:left;border-bottom:1px solid var(--border);font-size:12px;
}
.tl-step .step-body th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase}
.tl-step pre{
  background:var(--bg);padding:8px;border-radius:6px;font-size:12px;
  overflow-x:auto;color:var(--fg);margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ── RIGHT PANEL ── */
.panel-right{
  background:var(--surface);border-left:1px solid var(--border);padding:16px;overflow-y:auto;
  display:flex;flex-direction:column;gap:14px;
}
.panel-right h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.risk-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.risk-card .risk-label{font-size:11px;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.risk-card .risk-value{font-size:20px;font-weight:700}
.risk-card .risk-value.green{color:var(--green)}.risk-card .risk-value.red{color:var(--red)}.risk-card .risk-value.yellow{color:var(--yellow)}
.alert-item{
  padding:8px 10px;border-radius:6px;font-size:12px;margin-bottom:6px;
  border-left:3px solid;display:flex;align-items:flex-start;gap:6px;
}
.alert-item.warn{background:rgba(234,179,8,.08);border-color:var(--yellow);color:var(--yellow)}
.alert-item.err{background:rgba(239,68,68,.08);border-color:var(--red);color:var(--red)}
.alert-item.info{background:rgba(96,165,250,.08);border-color:var(--accent);color:var(--accent)}
.mode-switch{display:flex;gap:4px;background:var(--bg);border-radius:6px;padding:3px}
.mode-switch button{
  flex:1;padding:6px 8px;border:none;border-radius:4px;font-size:12px;
  font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:.15s;
}
.mode-switch button.active{background:var(--blue);color:#fff}

/* ── TOP-LEVEL VIEWS ── */
.view{display:none}.view.active{display:block}
#view-dashboard .main{display:grid;grid-template-columns:280px 1fr 280px;grid-template-rows:1fr auto;gap:0;min-height:calc(100vh - 40px)}
#view-market{padding:20px;height:calc(100vh - 40px);overflow-y:auto}
#view-market h2{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
#view-market .market-table{width:100%;border-collapse:collapse}
#view-market .market-table th{
  padding:10px 14px;text-align:left;border-bottom:2px solid var(--border);
  font-size:12px;color:var(--dim);font-weight:500;text-transform:uppercase;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
#view-market .market-table td{
  padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;
}
#view-market .market-table tr:hover{background:rgba(96,165,250,.05)}
#view-market .market-empty{
  display:flex;align-items:center;justify-content:center;height:60%;
  color:var(--dim);font-size:14px;
}

/* ── BOTTOM PANEL ── */
.panel-bottom{
  grid-column:1/-1;background:var(--surface);border-top:1px solid var(--border);
  padding:0 20px;height:280px;min-height:200px;display:flex;flex-direction:column;
}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab-bar button{
  padding:10px 18px;border:none;background:transparent;color:var(--muted);
  font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:.15s;
}
.tab-bar button.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow-y:auto;padding:12px 0}
.tab-pane{display:none}.tab-pane.active{display:block}
.tab-pane table{width:100%;border-collapse:collapse}
.tab-pane th,.tab-pane td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
.tab-pane th{color:var(--dim);font-weight:500;text-transform:uppercase;font-size:11px;position:sticky;top:0;background:var(--surface)}
/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0;font-size:12px}
.pagination button{
  padding:4px 12px;border:1px solid var(--border);border-radius:4px;
  background:var(--bg);color:var(--muted);cursor:pointer;font-size:12px;transition:.15s;
}
.pagination button:hover:not(:disabled){color:var(--fg);border-color:var(--accent)}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.pagination .page-info{color:var(--dim);min-width:60px;text-align:center}

/* ── BACKTEST RESULT CARD ── */
.bt-card{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;margin-top:6px;font-size:12px;
}
.bt-card .bt-row{display:flex;justify-content:space-between;padding:3px 0}
.bt-card .bt-label{color:var(--dim)}
.bt-card .bt-value{color:var(--fg);font-weight:600}
.bt-card .bt-value.green{color:var(--green)}.bt-card .bt-value.red{color:var(--red)}

/* ── FACTOR ANALYSIS ── */
.factor-section{margin-top:10px}
.factor-section h3{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.factor-card{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;margin-bottom:8px;font-size:12px;
}
.factor-card .fc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.factor-card .fc-symbol{font-weight:700;color:var(--fg);font-size:13px}
.factor-card .fc-action{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.factor-card .fc-action.buy{background:rgba(34,197,94,.2);color:var(--green)}
.factor-card .fc-action.sell{background:rgba(239,68,68,.2);color:var(--red)}
.factor-card .fc-action.hold{background:rgba(148,163,184,.15);color:var(--muted)}
.factor-card .fc-score{font-size:11px;color:var(--dim);margin-bottom:6px}
.factor-bar-row{display:flex;align-items:center;gap:6px;padding:2px 0}
.factor-bar-label{width:100px;color:var(--dim);font-size:11px;text-align:right;flex-shrink:0}
.factor-bar-track{flex:1;height:14px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative}
.factor-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.factor-bar-fill.positive{background:var(--green)}
.factor-bar-fill.negative{background:var(--red)}
.factor-bar-value{width:60px;font-size:11px;color:var(--fg);text-align:right;flex-shrink:0}
.factor-threshold{position:absolute;top:0;height:100%;width:2px;background:var(--yellow);z-index:1}

/* ── STOCK SCANNER ── */
.scan-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin-bottom:12px}
.scan-table{width:100%;border-collapse:collapse}
.scan-table th{padding:6px 8px;text-align:left;font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;border-bottom:1px solid var(--border)}
.scan-table td{padding:6px 8px;font-size:12px;border-bottom:1px solid var(--border)}
.scan-table tr:hover{background:rgba(96,165,250,.05)}
.scan-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.scan-badge.buy{background:rgba(34,197,94,.2);color:var(--green)}
.scan-badge.sell{background:rgba(239,68,68,.2);color:var(--red)}
.scan-badge.hold{background:rgba(148,163,184,.15);color:var(--muted)}
.scan-section-title{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:600}
.scan-summary{font-size:11px;color:var(--dim);margin-bottom:8px}

/* ── BADGES ── */
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;display:inline-block}
.badge-buy{background:rgba(34,197,94,.2);color:var(--green)}
.badge-sell{background:rgba(239,68,68,.2);color:var(--red)}
.badge-hold{background:rgba(148,163,184,.15);color:var(--muted)}
.badge-filled{background:rgba(59,130,246,.2);color:var(--blue)}
.badge-pending{background:rgba(234,179,8,.15);color:var(--yellow)}
.badge-error{background:rgba(239,68,68,.15);color:var(--red)}
.quote-up{color:var(--green)}
.quote-down{color:var(--red)}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>

<!-- ════════ TOP STATUS BAR ════════ -->
<div class="status-bar">
  <span class="brand">A股模拟工作台</span>
  <span class="sep"></span>
  <div class="nav-group">
    <button class="active" onclick="switchView(this,'view-dashboard')">工作台</button>
    <button onclick="switchView(this,'view-market')">实时行情</button>
  </div>
  <span class="sep"></span>
  <span class="pill mode" id="mode-pill">影子模式</span>
  <span class="sep"></span>
  <span><span class="dot g" id="db-dot"></span> 数据库</span>
  <span><span class="dot g" id="llm-dot"></span> LLM</span>
  <span><span class="dot g" id="mkt-dot"></span> 行情</span>
  <span class="sep"></span>
  <span style="color:var(--dim)">交易日: <span id="trade-date">--</span></span>
  <span style="color:var(--dim)">上次运行: <span id="last-run">--</span></span>
  <button class="kill-btn" onclick="killSwitch()">KILL SWITCH</button>
</div>

<!-- ════════ MAIN 3-COL + BOTTOM ════════ -->
<div class="view active" id="view-dashboard">
<div class="main">

  <!-- ── LEFT: 策略与模拟配置 ── -->
  <div class="panel-left">
    <h2>策略配置</h2>
    <div class="field">
      <label>模拟总资金 (元)</label>
      <input type="number" id="cfg-capital" value="1000000" step="100000">
    </div>
    <div class="field">
      <label>观察列表 (逗号分隔)</label>
      <textarea id="cfg-watchlist" placeholder="600519.SH,000858.SZ,601318.SH">600519.SH,000858.SZ,601318.SH</textarea>
    </div>
    <div class="field">
      <label>手动添加股票</label>
      <input type="text" id="cfg-add-stock" placeholder="输入代码后回车添加">
    </div>
    <div class="field-row">
      <div class="field">
        <label>单票最大仓位 (%)</label>
        <input type="number" id="cfg-max-pos" value="20" min="1" max="100">
      </div>
      <div class="field">
        <label>止损阈值 (%)</label>
        <input type="number" id="cfg-stop-loss" value="-5" step="0.5">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>单日最大亏损 (%)</label>
        <input type="number" id="cfg-max-daily" value="-3" step="0.5">
      </div>
      <div class="field">
        <label>决策模式</label>
        <select id="cfg-mode">
          <option value="mock">Mock (模拟)</option>
          <option value="real">Real (实盘决策)</option>
        </select>
      </div>
    </div>
    <div class="toggle-row">
      <span>允许新开仓</span>
      <div class="toggle on" id="cfg-new-pos" onclick="this.classList.toggle('on')"></div>
    </div>
    <div class="toggle-row">
      <span>仅生成决策 (不执行)</span>
      <div class="toggle" id="cfg-decision-only" onclick="this.classList.toggle('on')"></div>
    </div>
    <button class="save-btn" id="save-btn" onclick="savePreferences()">保存配置</button>
    <span id="save-status" style="font-size:11px;color:var(--dim);margin-left:8px"></span>
    <button class="run-btn" id="run-btn" onclick="triggerRun()">运行一轮模拟交易</button>
    <h2 style="margin-top:12px;border-top:1px solid var(--border);padding-top:14px">快速回测</h2>
    <div class="field-row">
      <div class="field">
        <label>开始日期</label>
        <input type="date" id="cfg-bt-start" value="2025-01-01">
      </div>
      <div class="field">
        <label>结束日期</label>
        <input type="date" id="cfg-bt-end" value="2025-03-31">
      </div>
    </div>
    <button class="run-btn" id="bt-btn" onclick="triggerBacktest()">运行回测</button>
    <div id="bt-result" style="margin-top:8px;font-size:12px;color:var(--muted)"></div>
  </div>

  <!-- ── CENTER: 今日选股 + 本轮运行主视图 ── -->
  <div class="panel-center">
    <h2>今日选股</h2>
    <div class="scan-card" id="scan-result">
      <button class="run-btn" id="scan-btn" onclick="triggerScan()" style="margin-bottom:10px;font-size:12px;padding:8px 12px">全市场扫描</button>
      <div id="scan-content" style="font-size:12px;color:var(--dim)">点击按钮开始全市场扫描</div>
    </div>

    <h2>本轮运行</h2>
    <div class="timeline" id="timeline">
      <div class="timeline-empty" id="timeline-empty">
        配置参数后点击「运行一轮模拟交易」开始
      </div>
    </div>
  </div>

  <!-- ── RIGHT: 风控与人工接管 ── -->
  <div class="panel-right">
    <h2>风控状态</h2>
    <div class="risk-card">
      <div class="risk-label">当日累计盈亏</div>
      <div class="risk-value green" id="risk-pnl">¥0</div>
    </div>
    <div class="risk-card">
      <div class="risk-label">持仓集中度</div>
      <div class="risk-value" id="risk-concentration" style="color:var(--fg)">--</div>
    </div>
    <div class="risk-card">
      <div class="risk-label">活跃目标仓位</div>
      <div class="risk-value" id="risk-targets" style="color:var(--accent)">0</div>
    </div>
    <div class="risk-card">
      <div class="risk-label">未完成订单</div>
      <div class="risk-value" id="risk-open-orders" style="color:var(--yellow)">0</div>
    </div>
    <h2>执行模式</h2>
    <div class="mode-switch" id="exec-mode">
      <button class="active" data-mode="full" onclick="setExecMode(this)">完整链路</button>
      <button data-mode="decision" onclick="setExecMode(this)">仅决策</button>
    </div>
    <h2>异常提示</h2>
    <div id="alerts-area">
      <div class="alert-item info">系统就绪，等待运行</div>
    </div>
  </div>

  <!-- ── BOTTOM: 历史与回放 ── -->
  <div class="panel-bottom">
    <div class="tab-bar">
      <button class="active" onclick="switchTab(this,'tab-decisions')">最近决策</button>
      <button onclick="switchTab(this,'tab-orders')">最近订单</button>
      <button onclick="switchTab(this,'tab-targets')">当前目标仓位</button>
      <button onclick="switchTab(this,'tab-errors')">异常事件</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="tab-decisions">
        <table><thead><tr><th>时间</th><th>股票</th><th>动作</th><th>置信度</th><th>理由</th></tr></thead><tbody id="tb-decisions"><tr><td colspan="5" style="color:var(--dim)">暂无数据</td></tr></tbody></table>
        <div id="pag-decisions"></div>
      </div>
      <div class="tab-pane" id="tab-orders">
        <table><thead><tr><th>时间</th><th>股票</th><th>方向</th><th>数量</th><th>价格</th><th>状态</th></tr></thead><tbody id="tb-orders"><tr><td colspan="6" style="color:var(--dim)">暂无数据</td></tr></tbody></table>
        <div id="pag-orders"></div>
      </div>
      <div class="tab-pane" id="tab-targets">
        <table><thead><tr><th>股票</th><th>目标数量</th><th>目标权重</th><th>理由</th></tr></thead><tbody id="tb-targets"><tr><td colspan="4" style="color:var(--dim)">暂无数据</td></tr></tbody></table>
        <div id="pag-targets"></div>
      </div>
      <div class="tab-pane" id="tab-errors">
        <table><thead><tr><th>时间</th><th>级别</th><th>消息</th></tr></thead><tbody id="tb-errors"><tr><td colspan="3" style="color:var(--dim)">暂无异常</td></tr></tbody></table>
        <div id="pag-errors"></div>
      </div>
    </div>
  </div>

</div>
</div><!-- end #view-dashboard -->

<!-- ════════ MARKET VIEW ════════ -->
<div class="view" id="view-market">
  <h2>实时行情</h2>
  <table class="market-table">
    <thead>
      <tr>
        <th>股票</th><th>最新价</th><th>涨跌额</th><th>涨跌幅</th>
        <th>今开</th><th>最高</th><th>最低</th>
        <th>成交量</th><th>换手率</th><th>振幅</th><th>量比</th>
      </tr>
    </thead>
    <tbody id="tb-market-full">
      <tr><td colspan="11" class="market-empty">暂无行情数据</td></tr>
    </tbody>
  </table>
</div>

<script>
const WORKBENCH_API = '/api/v1/dashboard/workbench';
const RUN_API = '/api/v1/dashboard/run';
const MARKET_QUOTE_API = '/api/v1/market/quote';
const MARKET_BULK_API = '/api/v1/market/bulk';
const KILL_SWITCH_STATUS_API = '/api/v1/kill-switch/status';
const KILL_SWITCH_ACTIVATE_API = '/api/v1/kill-switch/activate';
const KILL_SWITCH_DEACTIVATE_API = '/api/v1/kill-switch/deactivate';
const PREFS_API = '/api/v1/dashboard/preferences';

let execMode = 'full';
let simRunning = false;
let killSwitchActive = false;
let configHydrated = false;

/* ── Pagination ── */
const PAGE_SIZE = 15;
const pag = {
  decisions: { page: 0, data: [] },
  orders:    { page: 0, data: [] },
  targets:   { page: 0, data: [] },
  errors:    { page: 0, data: [] },
};

function pagSlice(key) {
  const p = pag[key];
  const start = p.page * PAGE_SIZE;
  return p.data.slice(start, start + PAGE_SIZE);
}

function pagTotal(key) {
  return Math.max(1, Math.ceil(pag[key].data.length / PAGE_SIZE));
}

function pagPrev(key) {
  if (pag[key].page > 0) { pag[key].page--; renderPagTab(key); }
}

function pagNext(key) {
  if (pag[key].page < pagTotal(key) - 1) { pag[key].page++; renderPagTab(key); }
}

function renderPagControls(key) {
  const total = pagTotal(key);
  const cur = pag[key].page + 1;
  return `<div class="pagination">
    <button onclick="pagPrev('${key}')" ${cur <= 1 ? 'disabled' : ''}>◀ 上一页</button>
    <span class="page-info">${cur} / ${total}</span>
    <button onclick="pagNext('${key}')" ${cur >= total ? 'disabled' : ''}>下一页 ▶</button>
  </div>`;
}

function renderPagTab(key) {
  const renderers = { decisions: renderDecisions, orders: renderOrders, targets: renderTargets, errors: renderErrorEvents };
  if (renderers[key]) renderers[key](pag[key].data);
}

function switchTab(btn, paneId) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.getElementById(paneId).classList.add('active');
}

function switchView(btn, viewId) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
  if (viewId === 'view-market') {
    refreshMarketQuotes();
  }
}

function setExecMode(btn) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  execMode = btn.dataset.mode === 'decision' ? 'decision' : 'full';
}

function normalizeText(value, fallback = '--') {
  if (value === null || value === undefined) return fallback;
  const text = String(value).trim();
  return text ? text : fallback;
}

function pickFirst(obj, keys, fallback = null) {
  for (const key of keys) {
    if (obj && obj[key] !== null && obj[key] !== undefined && obj[key] !== '') {
      return obj[key];
    }
  }
  return fallback;
}

function escapeHtml(text) {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function formatDate(raw) {
  const value = normalizeText(raw, '');
  if (!value) return '--';
  return value.includes('T') ? value.split('T')[0] : value.slice(0, 10);
}

function formatTime(raw) {
  const value = normalizeText(raw, '');
  if (!value) return '--';
  if (value.includes('T')) {
    const time = value.split('T')[1] || '';
    return time.split('.')[0] || '--';
  }
  if (value.includes(' ')) {
    return value.split(' ')[1] || value;
  }
  return value.length > 8 ? value.slice(0, 8) : value;
}

function formatPercent(raw) {
  if (raw === null || raw === undefined || raw === '') return '--';
  const n = Number(raw);
  if (!Number.isFinite(n)) return normalizeText(raw);
  return `${(n * 100).toFixed(1)}%`;
}

function formatConfidence(raw) {
  if (raw === null || raw === undefined || raw === '') return '--';
  const n = Number(raw);
  if (!Number.isFinite(n)) return normalizeText(raw);
  const pct = n <= 1 ? n * 100 : n;
  return `${pct.toFixed(0)}%`;
}

function formatCurrency(raw) {
  if (raw === null || raw === undefined || raw === '') return '--';
  const n = Number(raw);
  if (!Number.isFinite(n)) return normalizeText(raw);
  const sign = n > 0 ? '+' : '';
  return `${sign}¥${n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function formatNumber(raw, digits = 2) {
  if (raw === null || raw === undefined || raw === '') return '--';
  const n = Number(raw);
  if (!Number.isFinite(n)) return normalizeText(raw);
  return n.toFixed(digits);
}

function formatSignedPercent(raw) {
  if (raw === null || raw === undefined || raw === '') return '--';
  const n = Number(raw);
  if (!Number.isFinite(n)) return normalizeText(raw);
  const sign = n > 0 ? '+' : '';
  return `${sign}${n.toFixed(2)}%`;
}

function formatVolume(raw) {
  if (raw === null || raw === undefined || raw === '') return '--';
  const n = Number(raw);
  if (!Number.isFinite(n)) return normalizeText(raw);
  return n.toLocaleString('zh-CN');
}

function toList(value) {
  return Array.isArray(value) ? value : [];
}

function serviceDotClass(status) {
  const normalized = normalizeText(status, '').toLowerCase();
  if (normalized === 'ok' || normalized === 'healthy' || normalized === 'active') return 'dot g';
  if (normalized === 'warning' || normalized === 'warn' || normalized === 'degraded' || normalized === 'unknown') return 'dot y';
  return 'dot r';
}

function toAlertLevel(level) {
  const normalized = normalizeText(level, '').toLowerCase();
  if (normalized === 'warning' || normalized === 'warn') return 'warn';
  if (normalized === 'error' || normalized === 'err' || normalized === 'critical' || normalized === 'fatal') return 'err';
  return 'info';
}

async function parseResponseBody(res) {
  const text = await res.text();
  if (!text) return '';
  try {
    return JSON.parse(text);
  } catch (_) {
    return text;
  }
}

function extractErrorMessage(body, fallback) {
  if (!body) return fallback;
  if (typeof body === 'string') return body;
  return normalizeText(body.detail || body.message || body.error, fallback);
}

function setKillSwitchButton(active) {
  killSwitchActive = Boolean(active);
  const btn = document.querySelector('.kill-btn');
  btn.textContent = killSwitchActive ? '解除 KILL SWITCH' : 'KILL SWITCH';
}

function renderStatus(workbench, killStatus) {
  const modeRaw = normalizeText(workbench.mode, '--');
  document.getElementById('mode-pill').textContent = modeRaw === 'shadow' ? '影子模式' : modeRaw;
  document.getElementById('trade-date').textContent = formatDate(workbench.trade_date);
  document.getElementById('last-run').textContent = formatTime(workbench.last_run_at);

  const services = workbench.services || {};
  document.getElementById('db-dot').className = serviceDotClass(services.database);
  document.getElementById('llm-dot').className = serviceDotClass(services.llm);
  document.getElementById('mkt-dot').className = serviceDotClass(services.market);

  const active = killStatus.active ?? workbench.kill_switch?.active ?? false;
  setKillSwitchButton(active);
}

let _savePrefsTimer = null;

function savePreferences() {
  clearTimeout(_savePrefsTimer);
  const statusEl = document.getElementById('save-status');
  statusEl.textContent = '保存中...';
  statusEl.style.color = 'var(--yellow)';

  const prefs = {
    watchlist: document.getElementById('cfg-watchlist').value
      .split(',').map(s => s.trim()).filter(Boolean),
    capital_base: Number(document.getElementById('cfg-capital').value),
    max_position_ratio: Number(document.getElementById('cfg-max-pos').value) / 100,
    stop_loss_ratio: Number(document.getElementById('cfg-stop-loss').value) / 100,
    max_daily_loss_ratio: Number(document.getElementById('cfg-max-daily').value) / 100,
    execution_mode: document.getElementById('cfg-decision-only').classList.contains('on') ? 'decision' : 'full',
  };

  fetch(PREFS_API, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(prefs),
  }).then(res => {
    if (res.ok) {
      statusEl.textContent = '已保存';
      statusEl.style.color = 'var(--green)';
      setTimeout(() => { statusEl.textContent = ''; }, 2000);
    } else {
      statusEl.textContent = '保存失败';
      statusEl.style.color = 'var(--red)';
    }
  }).catch(() => {
    statusEl.textContent = '保存失败';
    statusEl.style.color = 'var(--red)';
  });
}

function renderConfig(config) {
  if (!config || configHydrated) return;

  // 服务端偏好优先于 HTML 默认值
  if (config.watchlist) {
    document.getElementById('cfg-watchlist').value = Array.isArray(config.watchlist)
      ? config.watchlist.join(',') : config.watchlist;
  }
  if (config.capital_base !== undefined) {
    document.getElementById('cfg-capital').value = config.capital_base;
  }
  if (config.max_position_ratio !== undefined) {
    document.getElementById('cfg-max-pos').value = Number(config.max_position_ratio) * 100;
  }
  if (config.stop_loss_ratio !== undefined) {
    document.getElementById('cfg-stop-loss').value = Number(config.stop_loss_ratio) * 100;
  }
  if (config.max_daily_loss_ratio !== undefined) {
    document.getElementById('cfg-max-daily').value = Number(config.max_daily_loss_ratio) * 100;
  }
  if (config.allow_new_positions !== undefined) {
    document.getElementById('cfg-new-pos').classList.toggle('on', Boolean(config.allow_new_positions));
  }
  if (config.decision_mode) {
    document.getElementById('cfg-mode').value = config.decision_mode;
  }
  const mode = config.execution_mode === 'decision' ? 'decision' : 'full';
  const execButtons = document.querySelectorAll('#exec-mode button');
  execButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
  execMode = mode;
  configHydrated = true;
}

function renderDecisions(list) {
  const rows = toList(list);
  pag.decisions.data = rows;
  if (rows.length > PAGE_SIZE) pag.decisions.page = 0;
  const tb = document.getElementById('tb-decisions');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="5" style="color:var(--dim)">暂无数据</td></tr>';
    document.getElementById('pag-decisions').innerHTML = '';
    return;
  }
  const page = pagSlice('decisions');
  tb.innerHTML = page.map(item => {
    const time = formatTime(pickFirst(item, ['created_at', 'timestamp']));
    const symbol = normalizeText(pickFirst(item, ['symbol', 'stock_code']));
    const action = normalizeText(pickFirst(item, ['action', 'parsed_action', 'signal'])).toUpperCase();
    const badge = action === 'BUY' ? 'badge-buy' : action === 'SELL' ? 'badge-sell' : 'badge-hold';
    const confidence = formatConfidence(item.confidence);
    const reasonRaw = pickFirst(item, ['reason', 'rationale', 'message'], '');
    const reason = normalizeText(reasonRaw, '--');
    return `<tr><td>${escapeHtml(time)}</td><td>${escapeHtml(symbol)}</td><td><span class="badge ${badge}">${escapeHtml(action)}</span></td><td>${escapeHtml(confidence)}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(reason)}">${escapeHtml(reason)}</td></tr>`;
  }).join('');
  document.getElementById('pag-decisions').innerHTML = rows.length > PAGE_SIZE ? renderPagControls('decisions') : '';
}

function renderOrders(list) {
  const rows = toList(list);
  pag.orders.data = rows;
  if (rows.length > PAGE_SIZE) pag.orders.page = 0;
  const tb = document.getElementById('tb-orders');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="6" style="color:var(--dim)">暂无数据</td></tr>';
    document.getElementById('pag-orders').innerHTML = '';
    return;
  }
  const page = pagSlice('orders');
  tb.innerHTML = page.map(item => {
    const time = formatTime(pickFirst(item, ['created_at', 'timestamp']));
    const symbol = normalizeText(pickFirst(item, ['symbol', 'stock_code']));
    const side = normalizeText(pickFirst(item, ['side', 'action', 'parsed_action'])).toUpperCase();
    const badge = side === 'BUY' ? 'badge-buy' : side === 'SELL' ? 'badge-sell' : 'badge-hold';
    const quantity = normalizeText(pickFirst(item, ['quantity', 'qty', 'target_quantity', 'target_value']));
    const price = formatCurrency(pickFirst(item, ['price', 'limit_price'], null));
    const status = normalizeText(item.status).toUpperCase();
    const statusBadge = status === 'FILLED' ? 'badge-filled' : status === 'PENDING' ? 'badge-pending' : status === 'ERROR' ? 'badge-error' : 'badge-hold';
    return `<tr><td>${escapeHtml(time)}</td><td>${escapeHtml(symbol)}</td><td><span class="badge ${badge}">${escapeHtml(side)}</span></td><td>${escapeHtml(quantity)}</td><td>${escapeHtml(price)}</td><td><span class="badge ${statusBadge}">${escapeHtml(status)}</span></td></tr>`;
  }).join('');
  document.getElementById('pag-orders').innerHTML = rows.length > PAGE_SIZE ? renderPagControls('orders') : '';
}

function renderTargets(list) {
  const rows = toList(list);
  pag.targets.data = rows;
  if (rows.length > PAGE_SIZE) pag.targets.page = 0;
  const tb = document.getElementById('tb-targets');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="4" style="color:var(--dim)">暂无数据</td></tr>';
    document.getElementById('pag-targets').innerHTML = '';
    return;
  }
  const page = pagSlice('targets');
  tb.innerHTML = page.map(item => {
    const symbol = normalizeText(pickFirst(item, ['symbol', 'stock_code']));
    const quantity = normalizeText(pickFirst(item, ['target_quantity', 'quantity', 'target_value']));
    const weight = formatPercent(pickFirst(item, ['target_weight', 'target_position_ratio'], null));
    const reason = normalizeText(pickFirst(item, ['reason', 'rationale'], '--'));
    return `<tr><td>${escapeHtml(symbol)}</td><td>${escapeHtml(quantity)}</td><td>${escapeHtml(weight)}</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(reason)}">${escapeHtml(reason)}</td></tr>`;
  }).join('');
  document.getElementById('pag-targets').innerHTML = rows.length > PAGE_SIZE ? renderPagControls('targets') : '';
}

function buildQuoteSymbols() {
  return document.getElementById('cfg-watchlist').value
    .split(',')
    .map(s => s.trim().toUpperCase())
    .filter(Boolean)
    .slice(0, 10);
}

function renderMarketQuotes(quotes) {
  const tb = document.getElementById('tb-market-full');
  if (!tb) return;
  const rows = toList(quotes);
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="11" class="market-empty">暂无行情数据</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(item => {
    const symbol = normalizeText(item.symbol, '--');
    const name = normalizeText(item.name, '');
    const close = Number(item.close);
    const changePct = Number(item.change_pct);
    const cls = (changePct ?? 0) > 0 ? 'quote-up' : (changePct ?? 0) < 0 ? 'quote-down' : '';
    const changeAmt = Number(item.prev_close) ? (close - Number(item.prev_close)).toFixed(2) : '--';
    return `<tr>
      <td>${escapeHtml(symbol)} ${escapeHtml(name)}</td>
      <td class="${cls}">${escapeHtml(formatNumber(close))}</td>
      <td class="${cls}">${escapeHtml(String(changeAmt))}</td>
      <td class="${cls}">${escapeHtml(formatSignedPercent(changePct))}</td>
      <td>${escapeHtml(formatNumber(item.open))}</td>
      <td>${escapeHtml(formatNumber(item.high))}</td>
      <td>${escapeHtml(formatNumber(item.low))}</td>
      <td>${escapeHtml(formatVolume(item.volume))}</td>
      <td>${escapeHtml(formatNumber(item.turnover))}%</td>
      <td>${escapeHtml(formatNumber(item.amplitude))}%</td>
      <td>${escapeHtml(formatNumber(item.volume_ratio))}</td>
    </tr>`;
  }).join('');
}

async function refreshMarketQuotes() {
  const symbols = buildQuoteSymbols();
  if (!symbols.length) {
    renderMarketQuotes([]);
    return;
  }
  try {
    const res = await fetch('/api/v1/market/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(symbols),
    });
    if (!res.ok) {
      renderMarketQuotes([]);
      return;
    }
    const data = await res.json();
    renderMarketQuotes(Array.isArray(data) ? data : []);
  } catch (error) {
    renderMarketQuotes([]);
  }
}

function renderRisk(risk, targets) {
  const targetList = toList(targets);
  const targetCount = risk.active_target_count ?? targetList.length;
  document.getElementById('risk-targets').textContent = targetCount;
  document.getElementById('risk-open-orders').textContent = risk.open_orders ?? 0;

  const concentrationRaw = risk.concentration_ratio ?? Math.max(0, ...targetList.map(t => Number(pickFirst(t, ['target_weight', 'target_position_ratio'], 0)) || 0));
  const concentration = Number(concentrationRaw) || 0;
  const concentrationEl = document.getElementById('risk-concentration');
  concentrationEl.textContent = `${(concentration * 100).toFixed(1)}%`;
  concentrationEl.className = `risk-value ${concentration > 0.3 ? 'red' : concentration > 0.2 ? 'yellow' : 'green'}`;

  const pnl = Number(pickFirst(risk, ['daily_pnl', 'pnl', 'today_pnl'], 0)) || 0;
  const pnlEl = document.getElementById('risk-pnl');
  pnlEl.textContent = formatCurrency(pnl);
  pnlEl.className = `risk-value ${pnl >= 0 ? 'green' : 'red'}`;
}

function renderErrorEvents(events) {
  const rows = toList(events);
  pag.errors.data = rows;
  if (rows.length > PAGE_SIZE) pag.errors.page = 0;
  const tb = document.getElementById('tb-errors');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="3" style="color:var(--dim)">暂无异常</td></tr>';
    document.getElementById('pag-errors').innerHTML = '';
    return;
  }
  const page = pagSlice('errors');
  tb.innerHTML = page.map(item => {
    const time = formatTime(pickFirst(item, ['created_at', 'timestamp', 'time']));
    const level = normalizeText(pickFirst(item, ['level', 'severity', 'event_type'])).toUpperCase();
    const message = normalizeText(pickFirst(item, ['message', 'summary', 'reason', 'payload']), '--');
    return `<tr><td>${escapeHtml(time)}</td><td>${escapeHtml(level)}</td><td>${escapeHtml(message)}</td></tr>`;
  }).join('');
  document.getElementById('pag-errors').innerHTML = rows.length > PAGE_SIZE ? renderPagControls('errors') : '';
}

function renderAlerts(alerts) {
  const rows = toList(alerts);
  const area = document.getElementById('alerts-area');
  if (!rows.length) {
    area.innerHTML = '<div class="alert-item info">系统就绪，等待运行</div>';
    return;
  }
  area.innerHTML = rows.map(item => {
    const cls = toAlertLevel(item.level);
    const time = formatTime(pickFirst(item, ['created_at', 'timestamp', 'time']));
    const message = normalizeText(item.message, '--');
    return `<div class="alert-item ${cls}">[${escapeHtml(time)}] ${escapeHtml(message)}</div>`;
  }).join('');
}

function stageLabel(stage) {
  const tag = normalizeText(stage, 'stage').toLowerCase();
  if (tag === 'decision') return '决策';
  if (tag === 'target') return '目标仓位';
  if (tag === 'execute') return '执行';
  if (tag === 'reconcile') return '对账';
  if (tag === 'error') return '异常';
  if (tag === 'blocked') return '阻断';
  return tag;
}

function stageBodyHtml(step) {
  const stage = normalizeText(step.stage || step.name, '').toLowerCase();
  const items = toList(step.items);
  if (items.length) {
    const first = items[0] || {};
    if (first.target_position_ratio !== undefined || first.target_weight !== undefined) {
      const rows = items.map(item => {
        const symbol = escapeHtml(normalizeText(pickFirst(item, ['symbol', 'stock_code'])));
        const quantity = escapeHtml(normalizeText(pickFirst(item, ['target_quantity', 'quantity', 'target_value'])));
        const weight = escapeHtml(formatPercent(pickFirst(item, ['target_weight', 'target_position_ratio'], null)));
        return `<tr><td>${symbol}</td><td>${quantity}</td><td>${weight}</td></tr>`;
      }).join('');
      return `<table><tr><th>股票</th><th>目标数量</th><th>权重</th></tr>${rows}</table>`;
    }
    if (first.status !== undefined || first.limit_price !== undefined || first.quantity !== undefined) {
      const rows = items.map(item => {
        const symbol = escapeHtml(normalizeText(pickFirst(item, ['symbol', 'stock_code'])));
        const action = escapeHtml(normalizeText(pickFirst(item, ['action', 'parsed_action']), '--').toUpperCase());
        const qty = escapeHtml(normalizeText(pickFirst(item, ['quantity', 'qty']), '--'));
        const status = escapeHtml(normalizeText(item.status, '--').toUpperCase());
        return `<tr><td>${symbol}</td><td>${action}</td><td>${qty}</td><td>${status}</td></tr>`;
      }).join('');
      return `<table><tr><th>股票</th><th>方向</th><th>数量</th><th>状态</th></tr>${rows}</table>`;
    }
    const rows = items.map(item => {
      const symbol = escapeHtml(normalizeText(pickFirst(item, ['symbol', 'stock_code'])));
      const action = normalizeText(pickFirst(item, ['action', 'parsed_action', 'signal']), '--').toUpperCase();
      const confidence = escapeHtml(formatConfidence(item.confidence));
      const badgeClass = action === 'BUY' ? 'badge-buy' : action === 'SELL' ? 'badge-sell' : 'badge-hold';
      return `<tr><td>${symbol}</td><td><span class="badge ${badgeClass}">${escapeHtml(action)}</span></td><td>${confidence}</td></tr>`;
    }).join('');
    return `<table><tr><th>股票</th><th>动作</th><th>置信度</th></tr>${rows}</table>`;
  }
  const message = normalizeText(step.message || step.summary || step.detail, '--');
  if (stage === 'reconcile') {
    const match = message.match(/([+-]¥[\d,]+(?:\.\d+)?)/);
    if (match) {
      const pnlLabel = match[1];
      const before = escapeHtml(message.slice(0, match.index));
      const after = escapeHtml(message.slice((match.index || 0) + pnlLabel.length));
      return `${before}<span style="color:var(--green)">${escapeHtml(pnlLabel)}</span>${after}`;
    }
  }
  return escapeHtml(message);
}

function renderTimeline(latestRun) {
  const timeline = document.getElementById('timeline');
  const steps = toList(latestRun?.steps);
  if (!steps.length) {
    timeline.innerHTML = '<div class="timeline-empty" id="timeline-empty">配置参数后点击「运行一轮模拟交易」开始</div>';
    return;
  }
  timeline.innerHTML = '';
  steps.forEach(step => {
    const stage = normalizeText(step.stage || step.name, 'stage').toLowerCase();
    const statusRaw = normalizeText(step.status, 'done').toLowerCase();
    const status = statusRaw === 'error' || statusRaw === 'failed' ? 'error' : statusRaw === 'running' || statusRaw === 'in_progress' ? 'running' : 'done';
    const time = formatTime(pickFirst(step, ['created_at', 'timestamp', 'time']));
    const div = document.createElement('div');
    div.className = `tl-step ${status}`;
    div.dataset.tag = stage;
    div.innerHTML = `
      <div class="step-head">
        <span class="step-tag ${stage}">${escapeHtml(stageLabel(stage))}</span>
        <span class="step-time">${escapeHtml(time)}</span>
      </div>
      <div class="step-body">${stageBodyHtml(step)}</div>
    `;
    timeline.appendChild(div);
  });
  timeline.scrollTop = timeline.scrollHeight;
}

function addAlert(level, message) {
  const area = document.getElementById('alerts-area');
  const div = document.createElement('div');
  div.className = `alert-item ${toAlertLevel(level)}`;
  div.textContent = `[${new Date().toLocaleTimeString('zh-CN', { hour12: false })}] ${message}`;
  area.prepend(div);
  while (area.children.length > 10) area.lastChild.remove();
}

function renderWorkbench(data, killStatus) {
  renderStatus(data, killStatus || {});
  // 合并服务端偏好到 config（服务端偏好优先于 API config）
  const config = { ...(data.config || {}), ...(data._serverPrefs || {}) };
  renderConfig(config);
  renderDecisions(data.history?.decisions || []);
  renderOrders(data.history?.orders || []);
  renderTargets(data.history?.targets || []);
  renderRisk(data.risk || {}, data.history?.targets || []);
  renderErrorEvents(data.history?.events || []);
  renderAlerts(data.risk?.alerts || []);
  renderTimeline(data.latest_run || { steps: [] });
}

async function loadDashboard() {
  try {
    const [workbenchRes, killStatusRes] = await Promise.all([
      fetch(WORKBENCH_API),
      fetch(KILL_SWITCH_STATUS_API),
    ]);
    const workbenchBody = await parseResponseBody(workbenchRes);
    const killStatusBody = await parseResponseBody(killStatusRes);

    if (!workbenchRes.ok) {
      throw new Error(extractErrorMessage(workbenchBody, `工作台加载失败 (${workbenchRes.status})`));
    }
    if (!killStatusRes.ok) {
      throw new Error(extractErrorMessage(killStatusBody, `Kill Switch 状态加载失败 (${killStatusRes.status})`));
    }

    // 加载服务端偏好
    let serverPrefs = null;
    try {
      const prefsRes = await fetch(PREFS_API);
      if (prefsRes.ok) {
        serverPrefs = await parseResponseBody(prefsRes);
      }
    } catch (_) {}

    // 合并服务端偏好到 config
    if (serverPrefs && serverPrefs.watchlist) {
      workbenchBody._serverPrefs = serverPrefs;
    }

    renderWorkbench(workbenchBody, killStatusBody);
    await refreshMarketQuotes();
  } catch (error) {
    addAlert('err', `数据加载失败: ${error.message}`);
  }
}

function buildRunPayload() {
  const watchlist = document.getElementById('cfg-watchlist').value
    .split(',')
    .map(s => s.trim())
    .filter(Boolean);
  const decisionOnly = document.getElementById('cfg-decision-only').classList.contains('on');
  const executionMode = decisionOnly ? 'decision' : execMode;
  return {
    capital_base: Number(document.getElementById('cfg-capital').value),
    watchlist,
    max_position_ratio: Number(document.getElementById('cfg-max-pos').value) / 100,
    stop_loss_ratio: Number(document.getElementById('cfg-stop-loss').value) / 100,
    max_daily_loss_ratio: Number(document.getElementById('cfg-max-daily').value) / 100,
    allow_new_positions: document.getElementById('cfg-new-pos').classList.contains('on'),
    decision_mode: document.getElementById('cfg-mode').value,
    execution_mode: executionMode,
  };
}

function finishRun() {
  simRunning = false;
  const button = document.getElementById('run-btn');
  button.disabled = false;
  button.textContent = '运行一轮模拟交易';
}

const SCAN_API = '/api/v1/dashboard/scan';
let scanRunning = false;

async function triggerScan() {
  if (scanRunning) return;
  scanRunning = true;
  const btn = document.getElementById('scan-btn');
  btn.disabled = true;
  btn.textContent = '扫描中...';
  document.getElementById('scan-content').innerHTML = '<span style="color:var(--yellow)">正在扫描全市场，请稍候（约 5-10 秒）...</span>';

  try {
    const res = await fetch(SCAN_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ top_n: 10 }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || '扫描失败');
    renderScanResult(body);
  } catch (e) {
    document.getElementById('scan-content').innerHTML = `<span style="color:var(--red)">扫描失败: ${escapeHtml(e.message)}</span>`;
  } finally {
    scanRunning = false;
    btn.disabled = false;
    btn.textContent = '全市场扫描';
  }
}

function renderScanResult(data) {
  const area = document.getElementById('scan-content');
  if (data.status === 'no_catalog') {
    area.innerHTML = '<span style="color:var(--yellow)">股票列表不可用，请检查网络</span>';
    return;
  }

  let html = `<div class="scan-summary">已扫描 ${data.total_scanned} 只股票</div>`;

  const sections = [
    { key: 'buy', label: '买入信号', cls: 'buy' },
    { key: 'hold', label: '持有信号', cls: 'hold' },
    { key: 'sell', label: '卖出信号', cls: 'sell' },
  ];

  for (const sec of sections) {
    const items = data[sec.key] || [];
    if (!items.length) continue;
    html += `<div class="scan-section-title">${sec.label} (${items.length})</div>`;
    html += '<table class="scan-table"><thead><tr>';
    html += '<th>排名</th><th>股票</th><th>动作</th><th>评分</th><th>核心原因</th>';
    html += '</tr></thead><tbody>';
    items.forEach((item, idx) => {
      html += `<tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(item.symbol)} ${escapeHtml(item.name || '')}</td>
        <td><span class="scan-badge ${sec.cls}">${escapeHtml(item.action)}</span></td>
        <td style="font-weight:600">${item.score.toFixed(4)}</td>
        <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(item.reason)}">${escapeHtml(item.reason)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
  }

  area.innerHTML = html;
}

const BACKTEST_API = '/api/v1/dashboard/backtest';
let btRunning = false;

async function triggerBacktest() {
  if (btRunning) return;
  const watchlist = document.getElementById('cfg-watchlist').value
    .split(',').map(s => s.trim()).filter(Boolean);
  if (!watchlist.length) { alert('请先填写观察列表'); return; }

  btRunning = true;
  const btn = document.getElementById('bt-btn');
  btn.disabled = true;
  btn.textContent = '回测中...';
  document.getElementById('bt-result').innerHTML = '<span style="color:var(--yellow)">正在计算，请稍候...</span>';

  try {
    const res = await fetch(BACKTEST_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        watchlist,
        start_date: document.getElementById('cfg-bt-start').value,
        end_date: document.getElementById('cfg-bt-end').value,
        capital_base: Number(document.getElementById('cfg-capital').value),
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || '回测失败');
    renderBacktestResult(body);
  } catch (e) {
    document.getElementById('bt-result').innerHTML = `<span style="color:var(--red)">回测失败: ${escapeHtml(e.message)}</span>`;
  } finally {
    btRunning = false;
    btn.disabled = false;
    btn.textContent = '运行回测';
  }
}

function renderBacktestResult(data) {
  const area = document.getElementById('bt-result');
  if (data.status === 'no_data' || !data.results.length) {
    area.innerHTML = '<span style="color:var(--yellow)">无历史数据，无法回测</span>';
    return;
  }
  const s = data.summary;
  const avgRet = (s.total_return_avg * 100).toFixed(2);
  const worstDd = (s.max_drawdown_worst * 100).toFixed(2);
  const retCls = s.total_return_avg >= 0 ? 'green' : 'red';

  // 汇总卡片
  let html = `<div class="bt-card">
    <div class="bt-row"><span class="bt-label">区间平均收益</span><span class="bt-value ${retCls}">${avgRet}%</span></div>
    <div class="bt-row"><span class="bt-label">最大回撤</span><span class="bt-value red">${worstDd}%</span></div>
    <div class="bt-row"><span class="bt-label">总交易次数</span><span class="bt-value">${s.total_trades}</span></div>
  </div>`;

  // 多因子分析
  html += '<div class="factor-section"><h3>多因子选股分析</h3>';

  const factorNames = {
    momentum_20: '20日动量',
    momentum_60: '60日动量',
    ma20_gap: 'MA20偏离',
    ma60_gap: 'MA60偏离',
    volume_ratio_20: '量比',
    volatility_20: '波动率',
  };

  for (const r of data.results) {
    const fa = r.factor_analysis;
    if (!fa) continue;
    const actionCls = fa.action === 'BUY' ? 'buy' : fa.action === 'SELL' ? 'sell' : 'hold';
    const scoreColor = fa.technical_score >= fa.thresholds.buy ? 'green'
      : fa.technical_score <= fa.thresholds.sell ? 'red' : 'var(--fg)';

    html += `<div class="factor-card">
      <div class="fc-header">
        <span class="fc-symbol">${escapeHtml(r.symbol)}</span>
        <span class="fc-action ${actionCls}">${fa.action}</span>
      </div>
      <div class="fc-score">综合评分: <span style="color:${scoreColor};font-weight:700">${fa.technical_score.toFixed(4)}</span>
        (买入≥${fa.thresholds.buy} / 卖出≤${fa.thresholds.sell})</div>`;

    // 因子贡献条形图
    const contributions = fa.contributions || {};
    const weights = fa.weights || {};
    const features = fa.features || {};
    const maxAbs = Math.max(0.001, ...Object.values(contributions).map(v => Math.abs(v)));

    for (const [key, label] of Object.entries(factorNames)) {
      const contrib = contributions[key] || 0;
      const val = features[key] !== undefined ? features[key] : 0;
      const weight = weights[key] || 0;
      const pct = Math.min(Math.abs(contrib) / maxAbs * 100, 100);
      const barCls = contrib >= 0 ? 'positive' : 'negative';
      const sign = contrib >= 0 ? '+' : '';

      html += `<div class="factor-bar-row">
        <span class="factor-bar-label">${label}</span>
        <div class="factor-bar-track">
          <div class="factor-bar-fill ${barCls}" style="width:${pct}%"></div>
        </div>
        <span class="factor-bar-value">${sign}${(contrib * 100).toFixed(2)}%</span>
      </div>`;
    }

    html += '</div>';
  }
  html += '</div>';

  area.innerHTML = html;
}

async function triggerRun() {
  if (simRunning) return;
  simRunning = true;
  const button = document.getElementById('run-btn');
  button.disabled = true;
  button.textContent = '运行中...';
  renderTimeline({
    steps: [{
      stage: 'decision',
      status: 'running',
      timestamp: new Date().toISOString(),
      message: '请求已提交，等待后端返回结果...',
    }],
  });

  try {
    const res = await fetch(RUN_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildRunPayload()),
    });
    const body = await parseResponseBody(res);
    if (!res.ok) {
      throw new Error(extractErrorMessage(body, `运行失败 (${res.status})`));
    }
    renderWorkbench(body, { active: killSwitchActive });
    addAlert('info', '本轮运行完成');
  } catch (error) {
    addAlert('err', `运行失败: ${error.message}`);
    await loadDashboard();
  } finally {
    finishRun();
  }
}

async function killSwitch() {
  const willActivate = !killSwitchActive;
  const confirmText = willActivate
    ? '确认触发 Kill Switch？将停止所有交易动作。'
    : '确认解除 Kill Switch？';
  if (!confirm(confirmText)) return;

  const endpoint = willActivate ? KILL_SWITCH_ACTIVATE_API : KILL_SWITCH_DEACTIVATE_API;
  try {
    const res = await fetch(endpoint, { method: 'POST' });
    const body = await parseResponseBody(res);
    if (!res.ok) {
      throw new Error(extractErrorMessage(body, `Kill Switch 操作失败 (${res.status})`));
    }
    addAlert(willActivate ? 'err' : 'info', willActivate ? 'Kill Switch 已激活' : 'Kill Switch 已解除');
    await loadDashboard();
  } catch (error) {
    addAlert('err', `Kill Switch 操作失败: ${error.message}`);
  }
}

document.getElementById('cfg-add-stock').addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;
  const value = event.target.value.trim();
  if (!value) return;
  const watchlistInput = document.getElementById('cfg-watchlist');
  const symbols = watchlistInput.value.split(',').map(s => s.trim()).filter(Boolean);
  if (!symbols.includes(value)) {
    symbols.push(value);
    watchlistInput.value = symbols.join(',');
  }
  event.target.value = '';
});

loadDashboard();
setInterval(() => {
  if (!simRunning) {
    loadDashboard();
  }
}, 900000);
setInterval(() => {
  if (!simRunning) {
    refreshMarketQuotes();
  }
}, 900000);
</script>
