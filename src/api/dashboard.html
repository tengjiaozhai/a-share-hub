<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股自动交易系统 - 交易工作台</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #0d0d14;
            --bg-tertiary: #12121a;
            --bg-panel: #0f0f17;
            --border-primary: #1a1a2e;
            --border-active: #2d2d4a;
            --text-primary: #e0e0e8;
            --text-secondary: #8888a0;
            --text-muted: #555570;
            --accent-green: #00ff88;
            --accent-green-dim: #00cc6a;
            --accent-red: #ff3366;
            --accent-red-dim: #cc2952;
            --accent-amber: #ffaa00;
            --accent-amber-dim: #cc8800;
            --accent-cyan: #00ddff;
            --accent-cyan-dim: #00aacc;
            --accent-blue: #4466ff;
            --glow-green: 0 0 10px rgba(0, 255, 136, 0.3);
            --glow-red: 0 0 10px rgba(255, 51, 102, 0.3);
            --glow-amber: 0 0 10px rgba(255, 170, 0, 0.3);
            --glow-cyan: 0 0 10px rgba(0, 221, 255, 0.3);
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            --font-display: 'Orbitron', 'JetBrains Mono', monospace;
            --scanline: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 136, 0.03) 2px,
                rgba(0, 255, 136, 0.03) 4px
            );
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--scanline);
            pointer-events: none;
            z-index: 1000;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
            pointer-events: none;
            z-index: 999;
        }

        .workbench {
            display: grid;
            grid-template-rows: 48px 1fr 240px;
            grid-template-columns: 280px 1fr 300px;
            height: 100vh;
            gap: 1px;
            background: var(--border-primary);
        }

        /* 顶部状态条 */
        .status-bar {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-primary);
            position: relative;
            overflow: hidden;
        }

        .status-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
            animation: scanline-move 3s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .status-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .system-title {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-green);
            text-shadow: var(--glow-green);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: var(--glow-green);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.warning {
            background: var(--accent-amber);
            box-shadow: var(--glow-amber);
        }

        .status-dot.error {
            background: var(--accent-red);
            box-shadow: var(--glow-red);
        }

        .status-dot.unknown {
            background: var(--text-muted);
            box-shadow: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-bar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mode-badge {
            padding: 4px 12px;
            border-radius: 2px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .mode-badge.shadow {
            background: rgba(0, 221, 255, 0.15);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan-dim);
        }

        .mode-badge.live {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red-dim);
        }

        .trade-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .trade-date span {
            color: var(--accent-amber);
            font-weight: 600;
        }

        /* 左侧策略配置 */
        .config-panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-green);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header::before {
            content: '▸';
            color: var(--accent-green);
        }

        .config-section {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
        }

        .config-section:last-child {
            border-bottom: none;
        }

        .config-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .config-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 12px;
            border-radius: 2px;
            transition: border-color 0.2s;
        }

        .config-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 1px var(--accent-green-dim);
        }

        .config-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .watchlist-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .watchlist-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--accent-green-dim);
            border-radius: 2px;
            font-size: 11px;
            color: var(--accent-green);
        }

        .watchlist-tag .remove {
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .watchlist-tag .remove:hover {
            opacity: 1;
        }

        .add-stock-input {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .add-stock-input input {
            flex: 1;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border-primary);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-active);
        }

        .btn-primary {
            background: rgba(0, 255, 136, 0.15);
            border-color: var(--accent-green-dim);
            color: var(--accent-green);
        }

        .btn-primary:hover {
            background: rgba(0, 255, 136, 0.25);
        }

        .btn-danger {
            background: rgba(255, 51, 102, 0.15);
            border-color: var(--accent-red-dim);
            color: var(--accent-red);
        }

        .btn-danger:hover {
            background: rgba(255, 51, 102, 0.25);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .config-actions {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        /* 中央时间线 */
        .timeline-panel {
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .timeline-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timeline-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-green);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timeline-title::before {
            content: '▸';
            color: var(--accent-green);
        }

        .run-status {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 2px;
            letter-spacing: 1px;
        }

        .run-status.idle {
            background: rgba(136, 136, 160, 0.15);
            color: var(--text-secondary);
        }

        .run-status.running {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
            animation: pulse 1s ease-in-out infinite;
        }

        .run-status.completed {
            background: rgba(0, 221, 255, 0.15);
            color: var(--accent-cyan);
        }

        .run-status.blocked {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
        }

        .timeline-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .timeline-steps {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .timeline-step {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 12px;
            padding: 12px;
            background: var(--bg-secondary);
            border-left: 3px solid var(--border-primary);
            border-radius: 0 2px 2px 0;
            transition: all 0.2s;
            animation: step-appear 0.3s ease-out;
        }

        @keyframes step-appear {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .timeline-step.done {
            border-left-color: var(--accent-green);
        }

        .timeline-step.running {
            border-left-color: var(--accent-amber);
            background: rgba(255, 170, 0, 0.05);
        }

        .timeline-step.error {
            border-left-color: var(--accent-red);
        }

        .timeline-step.blocked {
            border-left-color: var(--accent-red);
            background: rgba(255, 51, 102, 0.05);
        }

        .step-stage {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .step-time {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .step-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .step-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .step-item {
            padding: 4px 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: 2px;
            font-size: 11px;
        }

        .step-item.buy {
            border-color: var(--accent-green-dim);
            color: var(--accent-green);
        }

        .step-item.sell {
            border-color: var(--accent-red-dim);
            color: var(--accent-red);
        }

        .step-item.hold {
            border-color: var(--text-muted);
            color: var(--text-secondary);
        }

        .step-message {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .timeline-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 12px;
            gap: 8px;
        }

        .timeline-empty .icon {
            font-size: 32px;
            opacity: 0.3;
        }

        /* 右侧风控面板 */
        .risk-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .risk-section {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-primary);
        }

        .risk-section:last-child {
            border-bottom: none;
        }

        .risk-metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .risk-metric-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .risk-metric-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .risk-metric-value.warning {
            color: var(--accent-amber);
        }

        .risk-metric-value.danger {
            color: var(--accent-red);
        }

        .alerts-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alert-item {
            padding: 8px;
            background: var(--bg-secondary);
            border-radius: 2px;
            font-size: 11px;
            display: flex;
            gap: 8px;
        }

        .alert-item .level {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 2px;
        }

        .alert-item .level.info {
            color: var(--accent-cyan);
            background: rgba(0, 221, 255, 0.1);
        }

        .alert-item .level.warning {
            color: var(--accent-amber);
            background: rgba(255, 170, 0, 0.1);
        }

        .alert-item .level.error {
            color: var(--accent-red);
            background: rgba(255, 51, 102, 0.1);
        }

        .alert-item .time {
            color: var(--text-muted);
            margin-left: auto;
            font-size: 10px;
        }

        .kill-switch-section {
            padding: 16px;
            margin-top: auto;
        }

        .kill-switch-btn {
            width: 100%;
            padding: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .kill-switch-btn.active {
            background: rgba(255, 51, 102, 0.3);
            border-color: var(--accent-red);
            animation: kill-pulse 1s ease-in-out infinite;
        }

        @keyframes kill-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 51, 102, 0.3); }
            50% { box-shadow: 0 0 20px rgba(255, 51, 102, 0.5); }
        }

        /* 底部历史回放 */
        .history-panel {
            grid-column: 1 / -1;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
        }

        .history-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-primary);
        }

        .history-tab {
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .history-tab:hover {
            color: var(--text-secondary);
            background: var(--bg-secondary);
        }

        .history-tab.active {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        .history-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .history-table th {
            text-align: left;
            padding: 8px 12px;
            background: var(--bg-secondary);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-primary);
            position: sticky;
            top: 0;
        }

        .history-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-secondary);
        }

        .history-table tr:hover td {
            background: var(--bg-secondary);
        }

        .action-badge {
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 10px;
            font-weight: 600;
        }

        .action-badge.buy {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
        }

        .action-badge.sell {
            background: rgba(255, 51, 102, 0.15);
            color: var(--accent-red);
        }

        .action-badge.hold {
            background: rgba(136, 136, 160, 0.15);
            color: var(--text-secondary);
        }

        .status-badge {
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-badge.filled {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
        }

        .status-badge.pending {
            background: rgba(255, 170, 0, 0.15);
            color: var(--accent-amber);
        }

        .status-badge.cancelled {
            background: rgba(136, 136, 160, 0.15);
            color: var(--text-secondary);
        }

        .history-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: loading-bounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loading-bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-active);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            .workbench {
                grid-template-columns: 240px 1fr 260px;
            }
        }

        @media (max-width: 900px) {
            .workbench {
                grid-template-columns: 1fr;
                grid-template-rows: 48px auto auto auto 200px;
            }

            .config-panel,
            .risk-panel {
                border-right: none;
                border-left: none;
                border-bottom: 1px solid var(--border-primary);
            }
        }
    </style>
</head>
<body>
    <div class="workbench">
        <!-- 顶部状态条 -->
        <div class="status-bar">
            <div class="status-bar-left">
                <div class="system-title">A-SHARE TRADING HUB</div>
                <div class="status-indicator">
                    <div class="status-dot" id="db-status"></div>
                    <span>数据库</span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot unknown" id="llm-status"></div>
                    <span>LLM</span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot unknown" id="market-status"></div>
                    <span>行情</span>
                </div>
            </div>
            <div class="status-bar-right">
                <div class="mode-badge shadow" id="mode-badge">SHADOW</div>
                <div class="trade-date">交易日: <span id="trade-date">--</span></div>
            </div>
        </div>

        <!-- 左侧策略配置 -->
        <div class="config-panel">
            <div class="panel-header">策略配置</div>
            
            <div class="config-section">
                <div class="config-label">初始资金</div>
                <input type="number" class="config-input" id="capital-base" value="1000000" min="0" step="10000">
            </div>

            <div class="config-section">
                <div class="config-label">监控列表</div>
                <div class="watchlist-container" id="watchlist-container">
                    <!-- 动态添加 -->
                </div>
                <div class="add-stock-input">
                    <input type="text" class="config-input" id="add-stock-input" placeholder="输入股票代码">
                    <button class="btn" id="add-stock-btn">+</button>
                </div>
            </div>

            <div class="config-section">
                <div class="config-label">最大持仓比例 (%)</div>
                <input type="number" class="config-input" id="max-position-ratio" value="20" min="0" max="100" step="1">
            </div>

            <div class="config-section">
                <div class="config-label">止损阈值 (%)</div>
                <input type="number" class="config-input" id="stop-loss-ratio" value="5" min="0" max="100" step="0.5">
            </div>

            <div class="config-section">
                <div class="config-label">单日最大亏损 (%)</div>
                <input type="number" class="config-input" id="max-daily-loss-ratio" value="3" min="0" max="100" step="0.5">
            </div>

            <div class="config-section">
                <div class="config-label">决策模式</div>
                <select class="config-input" id="decision-mode">
                    <option value="mock">Mock</option>
                    <option value="real" disabled>Real (开发中)</option>
                </select>
            </div>

            <div class="config-section">
                <div class="config-label">执行模式</div>
                <select class="config-input" id="execution-mode">
                    <option value="full">Full</option>
                    <option value="decision">Decision Only</option>
                </select>
            </div>

            <div class="config-actions">
                <button class="btn btn-primary" id="submit-run-btn">运行一轮</button>
            </div>
        </div>

        <!-- 中央时间线 -->
        <div class="timeline-panel">
            <div class="timeline-header">
                <div class="timeline-title">本轮运行时间线</div>
                <div class="run-status idle" id="run-status">IDLE</div>
            </div>
            <div class="timeline-content" id="timeline-content">
                <div class="timeline-empty">
                    <div class="icon">▶</div>
                    <div>点击"运行一轮"开始</div>
                </div>
            </div>
        </div>

        <!-- 右侧风控面板 -->
        <div class="risk-panel">
            <div class="panel-header">风控与监控</div>
            
            <div class="risk-section">
                <div class="risk-metric">
                    <span class="risk-metric-label">集中度限制</span>
                    <span class="risk-metric-value" id="concentration-ratio">20%</span>
                </div>
                <div class="risk-metric">
                    <span class="risk-metric-label">活跃目标数</span>
                    <span class="risk-metric-value" id="active-target-count">0</span>
                </div>
                <div class="risk-metric">
                    <span class="risk-metric-label">待执行订单</span>
                    <span class="risk-metric-value" id="open-orders">0</span>
                </div>
            </div>

            <div class="risk-section">
                <div class="config-label">告警信息</div>
                <div class="alerts-list" id="alerts-list">
                    <!-- 动态添加 -->
                </div>
            </div>

            <div class="kill-switch-section">
                <button class="btn btn-danger kill-switch-btn" id="kill-switch-btn">
                    KILL SWITCH
                </button>
            </div>
        </div>

        <!-- 底部历史回放 -->
        <div class="history-panel">
            <div class="history-tabs">
                <div class="history-tab active" data-tab="decisions">最近决策</div>
                <div class="history-tab" data-tab="orders">最近订单</div>
                <div class="history-tab" data-tab="targets">当前目标仓位</div>
                <div class="history-tab" data-tab="events">异常事件</div>
            </div>
            <div class="history-content" id="history-content">
                <div class="history-empty">暂无数据</div>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        let state = {
            config: {
                capital_base: 1000000,
                watchlist: ['600519.SH', '000858.SZ', '601318.SH'],
                max_position_ratio: 0.2,
                stop_loss_ratio: 0.05,
                max_daily_loss_ratio: 0.03,
                allow_new_positions: true,
                decision_mode: 'mock',
                execution_mode: 'full'
            },
            workbench: null,
            killSwitchActive: false,
            activeTab: 'decisions'
        };

        // DOM 元素
        const elements = {
            watchlistContainer: document.getElementById('watchlist-container'),
            addStockInput: document.getElementById('add-stock-input'),
            addStockBtn: document.getElementById('add-stock-btn'),
            submitRunBtn: document.getElementById('submit-run-btn'),
            killSwitchBtn: document.getElementById('kill-switch-btn'),
            timelineContent: document.getElementById('timeline-content'),
            runStatus: document.getElementById('run-status'),
            alertsList: document.getElementById('alerts-list'),
            historyContent: document.getElementById('history-content'),
            tradeDate: document.getElementById('trade-date'),
            modeBadge: document.getElementById('mode-badge'),
            dbStatus: document.getElementById('db-status'),
            llmStatus: document.getElementById('llm-status'),
            marketStatus: document.getElementById('market-status'),
            concentrationRatio: document.getElementById('concentration-ratio'),
            activeTargetCount: document.getElementById('active-target-count'),
            openOrders: document.getElementById('open-orders')
        };

        // 初始化
        function init() {
            renderWatchlist();
            bindEvents();
            loadWorkbench();
        }

        // 渲染监控列表
        function renderWatchlist() {
            elements.watchlistContainer.innerHTML = state.config.watchlist.map(symbol => `
                <div class="watchlist-tag">
                    <span>${symbol}</span>
                    <span class="remove" data-symbol="${symbol}">×</span>
                </div>
            `).join('');

            // 绑定删除事件
            elements.watchlistContainer.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const symbol = e.target.dataset.symbol;
                    state.config.watchlist = state.config.watchlist.filter(s => s !== symbol);
                    renderWatchlist();
                });
            });
        }

        // 绑定事件
        function bindEvents() {
            // 添加股票
            elements.addStockBtn.addEventListener('click', addStock);
            elements.addStockInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addStock();
            });

            // 提交运行
            elements.submitRunBtn.addEventListener('click', submitRun);

            // Kill Switch
            elements.killSwitchBtn.addEventListener('click', toggleKillSwitch);

            // 配置输入同步
            document.getElementById('capital-base').addEventListener('change', (e) => {
                state.config.capital_base = parseInt(e.target.value) || 1000000;
            });
            document.getElementById('max-position-ratio').addEventListener('change', (e) => {
                state.config.max_position_ratio = (parseFloat(e.target.value) || 20) / 100;
            });
            document.getElementById('stop-loss-ratio').addEventListener('change', (e) => {
                state.config.stop_loss_ratio = (parseFloat(e.target.value) || 5) / 100;
            });
            document.getElementById('max-daily-loss-ratio').addEventListener('change', (e) => {
                state.config.max_daily_loss_ratio = (parseFloat(e.target.value) || 3) / 100;
            });
            document.getElementById('decision-mode').addEventListener('change', (e) => {
                state.config.decision_mode = e.target.value;
            });
            document.getElementById('execution-mode').addEventListener('change', (e) => {
                state.config.execution_mode = e.target.value;
            });

            // Tab 切换
            document.querySelectorAll('.history-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    state.activeTab = e.target.dataset.tab;
                    document.querySelectorAll('.history-tab').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    renderHistory();
                });
            });
        }

        // 添加股票
        function addStock() {
            const input = elements.addStockInput;
            const symbol = input.value.trim().toUpperCase();
            if (symbol && !state.config.watchlist.includes(symbol)) {
                state.config.watchlist.push(symbol);
                renderWatchlist();
                input.value = '';
            }
        }

        // 加载工作台数据
        async function loadWorkbench() {
            try {
                const response = await fetch('/api/v1/dashboard/workbench');
                if (!response.ok) throw new Error('Failed to load workbench');
                state.workbench = await response.json();
                renderWorkbench();
            } catch (error) {
                console.error('加载工作台失败:', error);
                addAlert('error', '加载工作台数据失败');
            }
        }

        // 提交运行
        async function submitRun() {
            if (state.killSwitchActive) {
                addAlert('warning', 'Kill Switch 已激活，无法运行');
                return;
            }

            elements.submitRunBtn.disabled = true;
            elements.submitRunBtn.textContent = '运行中...';
            elements.runStatus.className = 'run-status running';
            elements.runStatus.textContent = 'RUNNING';

            try {
                const response = await fetch('/api/v1/dashboard/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state.config)
                });

                if (!response.ok) throw new Error('Run failed');

                state.workbench = await response.json();
                renderWorkbench();
                addAlert('info', '运行完成');
            } catch (error) {
                console.error('运行失败:', error);
                addAlert('error', '运行失败: ' + error.message);
                elements.runStatus.className = 'run-status idle';
                elements.runStatus.textContent = 'IDLE';
            } finally {
                elements.submitRunBtn.disabled = false;
                elements.submitRunBtn.textContent = '运行一轮';
            }
        }

        // 切换 Kill Switch
        async function toggleKillSwitch() {
            const endpoint = state.killSwitchActive 
                ? '/api/v1/kill-switch/deactivate'
                : '/api/v1/kill-switch/activate';

            try {
                const response = await fetch(endpoint, { method: 'POST' });
                if (!response.ok) throw new Error('Kill switch toggle failed');
                
                state.killSwitchActive = !state.killSwitchActive;
                renderKillSwitch();
                addAlert('info', state.killSwitchActive ? 'Kill Switch 已激活' : 'Kill Switch 已解除');
            } catch (error) {
                console.error('Kill Switch 操作失败:', error);
                addAlert('error', 'Kill Switch 操作失败');
            }
        }

        // 渲染工作台
        function renderWorkbench() {
            if (!state.workbench) return;

            const wb = state.workbench;

            // 更新状态栏
            elements.tradeDate.textContent = wb.trade_date || '--';
            elements.modeBadge.textContent = wb.mode?.toUpperCase() || 'SHADOW';
            elements.modeBadge.className = `mode-badge ${wb.mode || 'shadow'}`;

            // 更新服务状态
            updateServiceStatus('db-status', wb.services?.database);
            updateServiceStatus('llm-status', wb.services?.llm);
            updateServiceStatus('market-status', wb.services?.market);

            // 更新风控指标
            elements.concentrationRatio.textContent = `${(wb.risk?.concentration_ratio * 100 || 20).toFixed(0)}%`;
            elements.activeTargetCount.textContent = wb.risk?.active_target_count || 0;
            elements.openOrders.textContent = wb.risk?.open_orders || 0;

            // 更新告警
            if (wb.risk?.alerts) {
                state.alerts = wb.risk.alerts;
                renderAlerts();
            }

            // 更新 Kill Switch
            state.killSwitchActive = wb.kill_switch?.active || false;
            renderKillSwitch();

            // 更新配置
            if (wb.config) {
                state.config = { ...state.config, ...wb.config };
                document.getElementById('capital-base').value = wb.config.capital_base;
                document.getElementById('max-position-ratio').value = (wb.config.max_position_ratio * 100).toFixed(0);
                document.getElementById('stop-loss-ratio').value = (wb.config.stop_loss_ratio * 100).toFixed(1);
                document.getElementById('max-daily-loss-ratio').value = (wb.config.max_daily_loss_ratio * 100).toFixed(1);
                document.getElementById('decision-mode').value = wb.config.decision_mode;
                document.getElementById('execution-mode').value = wb.config.execution_mode;
                state.config.watchlist = wb.config.watchlist || [];
                renderWatchlist();
            }

            // 更新时间线
            renderTimeline(wb.latest_run);

            // 更新历史
            if (wb.history) {
                state.history = wb.history;
                renderHistory();
            }
        }

        // 更新服务状态指示器
        function updateServiceStatus(elementId, status) {
            const el = document.getElementById(elementId);
            el.className = 'status-dot';
            if (status === 'ok') {
                // 保持绿色
            } else if (status === 'unknown') {
                el.classList.add('unknown');
            } else {
                el.classList.add('error');
            }
        }

        // 渲染时间线
        function renderTimeline(latestRun) {
            if (!latestRun || !latestRun.steps || latestRun.steps.length === 0) {
                elements.timelineContent.innerHTML = `
                    <div class="timeline-empty">
                        <div class="icon">▶</div>
                        <div>点击"运行一轮"开始</div>
                    </div>
                `;
                elements.runStatus.className = 'run-status idle';
                elements.runStatus.textContent = 'IDLE';
                return;
            }

            elements.runStatus.className = `run-status ${latestRun.status}`;
            elements.runStatus.textContent = latestRun.status.toUpperCase();

            elements.timelineContent.innerHTML = `
                <div class="timeline-steps">
                    ${latestRun.steps.map((step, index) => `
                        <div class="timeline-step ${step.status}" style="animation-delay: ${index * 0.1}s">
                            <div class="step-stage">
                                <div>${getStageName(step.stage)}</div>
                                <div class="step-time">${formatTime(step.timestamp)}</div>
                            </div>
                            <div class="step-content">
                                ${step.items ? `
                                    <div class="step-items">
                                        ${step.items.map(item => `
                                            <div class="step-item ${(item.action || '').toLowerCase()}">
                                                ${item.symbol || ''} 
                                                ${item.action ? `<strong>${item.action}</strong>` : ''}
                                                ${item.confidence ? ` ${item.confidence}%` : ''}
                                                ${item.quantity ? ` ${item.quantity}股` : ''}
                                                ${item.status ? ` [${item.status}]` : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                                ${step.message ? `<div class="step-message">${step.message}</div>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 获取阶段名称
        function getStageName(stage) {
            const names = {
                'decision': '决策',
                'target': '目标仓位',
                'execute': '执行',
                'reconcile': '对账',
                'blocked': '阻断'
            };
            return names[stage] || stage;
        }

        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '--';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // 渲染告警
        function renderAlerts() {
            const alerts = state.alerts || [];
            elements.alertsList.innerHTML = alerts.map(alert => `
                <div class="alert-item">
                    <span class="level ${alert.level}">${alert.level}</span>
                    <span>${alert.message}</span>
                    <span class="time">${formatTime(alert.timestamp)}</span>
                </div>
            `).join('');
        }

        // 渲染 Kill Switch
        function renderKillSwitch() {
            elements.killSwitchBtn.className = `btn btn-danger kill-switch-btn ${state.killSwitchActive ? 'active' : ''}`;
            elements.killSwitchBtn.textContent = state.killSwitchActive ? 'KILL SWITCH ACTIVE' : 'KILL SWITCH';
            elements.submitRunBtn.disabled = state.killSwitchActive;
        }

        // 添加告警
        function addAlert(level, message) {
            if (!state.alerts) state.alerts = [];
            state.alerts.unshift({
                timestamp: new Date().toISOString(),
                level: level,
                message: message
            });
            if (state.alerts.length > 20) state.alerts.pop();
            renderAlerts();
        }

        // 渲染历史
        function renderHistory() {
            const history = state.history || {};
            const tab = state.activeTab;

            let html = '';

            switch (tab) {
                case 'decisions':
                    html = renderDecisionsTable(history.decisions || []);
                    break;
                case 'orders':
                    html = renderOrdersTable(history.orders || []);
                    break;
                case 'targets':
                    html = renderTargetsTable(history.targets || []);
                    break;
                case 'events':
                    html = renderEventsTable(history.events || []);
                    break;
            }

            elements.historyContent.innerHTML = html;
        }

        // 渲染决策表
        function renderDecisionsTable(decisions) {
            if (decisions.length === 0) return '<div class="history-empty">暂无决策数据</div>';
            return `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>股票</th>
                            <th>动作</th>
                            <th>置信度</th>
                            <th>原因</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${decisions.map(d => `
                            <tr>
                                <td>${formatTime(d.created_at)}</td>
                                <td>${d.symbol}</td>
                                <td><span class="action-badge ${(d.action || '').toLowerCase()}">${d.action}</span></td>
                                <td>${d.confidence}%</td>
                                <td>${d.reason || '--'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 渲染订单表
        function renderOrdersTable(orders) {
            if (orders.length === 0) return '<div class="history-empty">暂无订单数据</div>';
            return `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>股票</th>
                            <th>动作</th>
                            <th>数量</th>
                            <th>限价</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orders.map(o => `
                            <tr>
                                <td>${formatTime(o.created_at)}</td>
                                <td>${o.symbol}</td>
                                <td><span class="action-badge ${(o.action || '').toLowerCase()}">${o.action}</span></td>
                                <td>${o.quantity}</td>
                                <td>${o.limit_price?.toFixed(2) || '--'}</td>
                                <td><span class="status-badge ${(o.status || '').toLowerCase()}">${o.status}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 渲染目标仓位表
        function renderTargetsTable(targets) {
            if (targets.length === 0) return '<div class="history-empty">暂无目标仓位数据</div>';
            return `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>股票</th>
                            <th>目标价值</th>
                            <th>目标比例</th>
                            <th>过期时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${targets.map(t => `
                            <tr>
                                <td>${t.symbol}</td>
                                <td>¥${t.target_value?.toLocaleString() || '--'}</td>
                                <td>${(t.target_position_ratio * 100).toFixed(1)}%</td>
                                <td>${formatTime(t.expires_at)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 渲染事件表
        function renderEventsTable(events) {
            if (events.length === 0) return '<div class="history-empty">暂无异常事件</div>';
            return `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>级别</th>
                            <th>消息</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${events.map(e => `
                            <tr>
                                <td>${formatTime(e.timestamp)}</td>
                                <td><span class="level ${e.level}">${e.level}</span></td>
                                <td>${e.message}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 启动
        init();
    </script>
</body>
</html>
