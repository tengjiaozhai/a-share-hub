<div class="status-bar">
  <span class="brand">交易助手</span>
  <span class="sep"></span>
  <div class="nav-group">
    <button class="active" onclick="switchView(this,'view-dashboard')"><i class="bi bi-search"></i> 选股分析</button>
    <button onclick="switchView(this,'view-alpha')"><i class="bi bi-graph-up"></i> 持仓分析</button>
    <button onclick="switchView(this,'view-market')"><i class="bi bi-globe"></i> A股</button>
    <button onclick="switchView(this,'view-us-stock')"><i class="bi bi-globe"></i> 美股</button>
    <button onclick="switchView(this,'view-fund')"><i class="bi bi-bank"></i> 基金</button>
  </div>
  <span class="sep"></span>
  <span class="pill mode" id="mode-pill">影子模式</span>
  <span class="sep"></span>
  <span><span class="dot g" id="db-dot" role="status" aria-label="数据库状态"></span> 数据库</span>
  <span><span class="dot g" id="llm-dot" role="status" aria-label="LLM状态"></span> LLM</span>
  <span><span class="dot g" id="mkt-dot" role="status" aria-label="行情状态"></span> 行情</span>
  <span class="sep"></span>
  <span style="color:var(--dim)">交易日: <span id="trade-date">--</span></span>
  <span style="color:var(--dim)">上次运行: <span id="last-run">--</span></span>
  <div class="theme-switcher" id="theme-switcher">
    <button id="theme-switcher-btn" aria-haspopup="menu" aria-expanded="false" aria-label="切换界面主题" title="当前主题：交易终端 Trading Terminal">
      <i class="bi bi-palette"></i>
      <span id="theme-switcher-label">界面主题</span>
    </button>
    <div class="theme-menu" id="theme-menu" role="menu" hidden></div>
  </div>
  <form action="/api/v1/auth/logout" method="post" style="margin-left:auto">
    <button type="submit" style="height:24px;border:1px solid var(--stroke);background:var(--panel-2);color:var(--muted);padding:3px 10px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer">退出登录</button>
  </form>
  <button class="kill-btn" style="margin-left:0" onclick="killSwitch()" aria-label="紧急停止所有交易">KILL SWITCH</button>
</div>
