<div class="view alpha-desk" id="view-alpha">

  <section class="alpha-hero">
    <div class="alpha-hero-copy">
      <p class="alpha-kicker">持仓分析</p>
      <h2>股票代码优先的持仓分析台</h2>
      <p class="alpha-summary">先输入股票代码生成分析，再快速对照当前持仓、最近成交与 multi-leg 记录。保留必要的成交回填能力，但不再以执行台和候选流转为主。</p>
    </div>
  </section>

  <section class="alpha-analysis-grid">
    <div class="card alpha-report-card alpha-report-card-primary" id="alpha-report-card">
      <div class="card-head alpha-report-head">
        <div>
          <span>持仓分析报告</span>
          <div class="alpha-report-caption">主入口先看股票代码分析；留空时回落到当前持仓视角。</div>
        </div>
        <div class="alpha-report-controls">
          <select id="alpha-report-window" class="alpha-report-select">
            <option value="30d">30日</option>
            <option value="60d" selected>60日</option>
            <option value="120d">120日</option>
          </select>
          <label class="alpha-report-toggle">
            <input type="checkbox" id="alpha-report-include-shadow" checked>
            <span>包含模拟交易</span>
          </label>
          <label class="alpha-report-toggle">
            <input type="checkbox" id="alpha-report-include-backtest" checked>
            <span>包含历史回测</span>
          </label>
        </div>
      </div>
      <div class="card-body alpha-report-body alpha-report-body-primary">
        <div class="alpha-report-toolbar">
          <div class="alpha-field alpha-report-symbol-field">
            <label for="alpha-report-symbol">股票代码</label>
            <input id="alpha-report-symbol" placeholder="如 MU / 600519 / 000001.SZ / 多个代码用逗号分隔" />
          </div>
          <div class="alpha-field">
            <label for="alpha-report-position-ratio">持仓仓位 (%)</label>
            <input id="alpha-report-position-ratio" type="number" min="0" max="100" step="0.01" placeholder="如 35" />
          </div>
          <div class="alpha-field">
            <label for="alpha-report-buy-time">买入时间</label>
            <input id="alpha-report-buy-time" type="datetime-local" />
          </div>
          <button type="button" id="alpha-report-generate" class="run-btn accent alpha-report-trigger">
            分析股票
          </button>
        </div>
        <div class="alpha-report-empty" id="alpha-report-body">
          输入股票代码后立即生成分析；如需复盘当前组合，可留空直接基于持仓生成报告。
        </div>
      </div>
    </div>

    <article class="alpha-panel alpha-panel-holdings">
      <div class="alpha-panel-head">当前持仓</div>
      <div class="alpha-panel-body alpha-panel-body-tight">
        <div id="alpha-holdings-summary" class="alpha-holdings-summary"></div>
        <div class="alpha-section-label">持仓列表</div>
        <div id="alpha-positions" class="alpha-positions-list"></div>
      </div>
    </article>
  </section>

  <section class="alpha-ops-grid alpha-ops-grid-compact">
    <article class="alpha-panel alpha-panel-history">
      <div class="alpha-panel-head">成交 / Multi-leg 历史</div>
      <div class="alpha-panel-body">
        <div class="alpha-history-columns">
          <div class="alpha-data-section">
            <div class="alpha-section-label">最近成交</div>
            <div id="alpha-fill-history"></div>
          </div>
          <div class="alpha-data-section">
            <div class="alpha-section-label">Multi-leg 历史</div>
            <div id="alpha-multi-leg-history"></div>
          </div>
        </div>
      </div>
    </article>
  </section>

</div>
