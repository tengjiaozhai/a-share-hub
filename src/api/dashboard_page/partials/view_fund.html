<!-- 基金行情视图 -->
<div class="view" id="view-fund">
<div class="market-shell fund-shell">

  <aside class="mkt-rail-left" aria-label="基金筛选与状态">
    <div class="mkt-card">
      <div class="mkt-card-head">ETF 搜索</div>
      <div class="mkt-card-body">
        <div class="mkt-search-row">
          <input type="text" id="etf-search" class="mkt-input" placeholder="代码或名称...">
          <button class="mkt-btn mkt-btn-accent" type="button" id="btn-etf-search">搜索</button>
        </div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">基金目录</div>
      <div class="mkt-card-body">
        <div class="fund-filter-stack">
          <input type="text" id="fund-search" class="mkt-input" placeholder="名称或代码...">
          <select id="fund-type-filter" class="mkt-input">
            <option value="">全部类型</option>
            <option value="股票型">股票型</option>
            <option value="混合型">混合型</option>
            <option value="债券型">债券型</option>
            <option value="指数型">指数型</option>
            <option value="ETF">ETF</option>
            <option value="LOF">LOF</option>
          </select>
          <button class="mkt-btn mkt-btn-outline" type="button" id="btn-fund-search">查询目录</button>
        </div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">行情状态</div>
      <div class="mkt-card-body">
        <div class="mkt-kpi-row">
          <span class="mkt-kpi-label">数据刷新</span>
          <span class="mkt-kpi-val" id="fund-last-refresh">--</span>
        </div>
        <button id="btn-refresh-fund" class="mkt-btn mkt-btn-outline fund-refresh-btn" type="button">刷新当前</button>
      </div>
    </div>
  </aside>

  <main class="mkt-rail-center" aria-label="基金行情">
    <div class="mkt-tabs" id="fund-tabs">
      <button class="active" type="button" data-target="#etf-spot">ETF 实时行情</button>
      <button id="fund-catalog-tab" type="button" data-target="#fund-catalog">基金目录</button>
      <button id="fund-nav-tab" type="button" data-target="#fund-nav">基金净值</button>
    </div>

    <div class="tab-pane active fund-pane" id="etf-spot">
      <div class="mkt-toolbar">
        <span class="mkt-kpi-label">ETF 实时行情</span>
        <span id="etf-spot-count" class="mkt-count"></span>
      </div>
      <div class="mkt-table-wrap">
        <table class="mkt-table" id="etf-spot-table">
          <thead>
            <tr>
              <th>代码</th>
              <th>名称</th>
              <th>最新价</th>
              <th>涨跌幅</th>
              <th>涨跌额</th>
              <th>成交量</th>
              <th>成交额</th>
              <th>开盘价</th>
              <th>最高价</th>
              <th>最低价</th>
              <th>昨收</th>
            </tr>
          </thead>
          <tbody id="etf-spot-body">
            <tr><td colspan="11" class="mkt-empty">正在加载 ETF 行情...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="etf-spot-pagination" class="mkt-pagination"></div>
    </div>

    <div class="tab-pane fund-pane" id="fund-catalog">
      <div class="mkt-toolbar">
        <span class="mkt-kpi-label">基金目录</span>
        <span id="fund-catalog-count" class="mkt-count"></span>
      </div>
      <div class="mkt-table-wrap">
        <table class="mkt-table" id="fund-catalog-table">
          <thead>
            <tr>
              <th>代码</th>
              <th>名称</th>
              <th>类型</th>
              <th>交易所</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="fund-catalog-body">
            <tr><td colspan="5" class="mkt-empty">正在加载基金目录...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="fund-catalog-pagination" class="mkt-pagination"></div>
    </div>

    <div class="tab-pane fund-pane" id="fund-nav">
      <div id="nav-chart-container" class="fund-nav-chart" style="display:none">
        <canvas id="nav-chart"></canvas>
      </div>
      <div class="mkt-table-wrap">
        <table class="mkt-table" id="fund-nav-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>单位净值</th>
              <th>累计净值</th>
              <th>日增长率</th>
              <th>申购状态</th>
              <th>赎回状态</th>
            </tr>
          </thead>
          <tbody id="fund-nav-body">
            <tr><td colspan="6" class="mkt-empty">请输入基金代码查询净值</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <aside class="mkt-rail-right" aria-label="基金净值查询">
    <div class="mkt-card">
      <div class="mkt-card-head">净值查询</div>
      <div class="mkt-card-body">
        <div class="fund-filter-stack">
          <input type="text" id="nav-symbol" class="mkt-input" placeholder="基金代码，如 511280">
          <div class="fund-date-row">
            <input type="date" id="nav-start-date" class="mkt-input">
            <input type="date" id="nav-end-date" class="mkt-input">
          </div>
          <button class="mkt-btn mkt-btn-accent" type="button" id="btn-query-nav">查询净值</button>
        </div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">当前基金</div>
      <div class="mkt-card-body">
        <div id="fund-current-summary" class="mkt-detail-placeholder">选择目录基金或输入代码查询</div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">数据范围</div>
      <div class="mkt-card-body">
        <div class="mkt-kpi-row">
          <span class="mkt-kpi-label">行情</span>
          <span class="mkt-kpi-val">ETF 实时</span>
        </div>
        <div class="mkt-kpi-row">
          <span class="mkt-kpi-label">净值</span>
          <span class="mkt-kpi-val">历史 NAV</span>
        </div>
      </div>
    </div>
  </aside>

</div>
</div>
