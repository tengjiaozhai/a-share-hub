<div class="view" id="view-us-stock">
<div class="market-shell">

  <!-- ═══ LEFT RAIL: Search + Watchlist ═══ -->
  <aside class="mkt-rail-left" aria-label="美股搜索与自选">
    <div class="mkt-card">
      <div class="mkt-card-head">搜索美股</div>
      <div class="mkt-card-body">
        <div class="mkt-search-row">
          <input type="text" id="us-search-input" class="mkt-input" placeholder="输入代码或名称...">
          <button class="mkt-btn mkt-btn-accent" onclick="usSearch()">搜索</button>
        </div>
        <div id="us-search-results" class="mkt-search-results"></div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">自选管理</div>
      <div class="mkt-card-body">
        <div class="mkt-search-row">
          <input type="text" id="us-add-symbol" class="mkt-input" placeholder="股票代码">
          <button class="mkt-btn mkt-btn-green" onclick="usAddManual()">+ 添加</button>
        </div>
        <div id="us-watchlist-chips" class="mkt-chips"></div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">市场状态</div>
      <div class="mkt-card-body">
        <div class="mkt-kpi-row">
          <span class="mkt-kpi-label">交易时间</span>
          <span class="mkt-kpi-val" id="us-market-status">加载中...</span>
        </div>
        <div class="mkt-kpi-row">
          <span class="mkt-kpi-label">数据刷新</span>
          <span class="mkt-kpi-val" id="us-last-refresh">--</span>
        </div>
        <button class="mkt-btn mkt-btn-outline" onclick="usLoadQuotes()" style="margin-top:8px;width:100%">刷新行情</button>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">币安连接</div>
      <div class="mkt-card-body">
        <div id="us-binance-status" class="mkt-kpi-val">检查中...</div>
      </div>
    </div>
  </aside>

  <!-- ═══ CENTER: Quotes + KLine + Fundamental ═══ -->
  <main class="mkt-rail-center" aria-label="美股行情">
    <div class="mkt-tabs">
      <button class="active" onclick="usSwitchCenterTab(this,'us-quotes-pane')">行情列表</button>
      <button onclick="usSwitchCenterTab(this,'us-kline-pane')">K线图</button>
      <button onclick="usSwitchCenterTab(this,'us-fundamental-pane')">基本面</button>
    </div>

    <div class="tab-pane active" id="us-quotes-pane">
      <div class="mkt-toolbar">
        <input type="text" id="us-quotes-search" class="mkt-input" placeholder="搜索代码或名称...">
        <span id="us-quotes-count" class="mkt-count"></span>
      </div>
      <div id="us-quotes-loading" class="mkt-empty">加载中...</div>
      <div class="mkt-table-wrap">
        <table class="mkt-table" id="us-quotes-table" style="display:none">
          <thead>
            <tr>
              <th>代码</th><th>名称</th><th>最新价</th><th>涨跌额</th><th>涨跌幅</th>
              <th>开盘</th><th>最高</th><th>最低</th><th>成交量</th><th>市值</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="us-quotes-body"></tbody>
        </table>
      </div>
      <div id="us-quotes-pagination" class="mkt-pagination"></div>
    </div>

    <div class="tab-pane" id="us-kline-pane">
      <div class="mkt-toolbar">
        <span class="mkt-kpi-label">周期</span>
        <div class="mkt-pill-group">
          <button class="mkt-pill active" onclick="usSetKlineInterval(this,'1d','1mo')">日K</button>
          <button class="mkt-pill" onclick="usSetKlineInterval(this,'1d','3mo')">3月</button>
          <button class="mkt-pill" onclick="usSetKlineInterval(this,'1d','6mo')">6月</button>
          <button class="mkt-pill" onclick="usSetKlineInterval(this,'1d','1y')">1年</button>
          <button class="mkt-pill" onclick="usSetKlineInterval(this,'1wk','1y')">周K</button>
          <button class="mkt-pill" onclick="usSetKlineInterval(this,'1mo','5y')">月K</button>
        </div>
        <span id="us-kline-symbol" class="mkt-kpi-val" style="margin-left:auto">--</span>
      </div>
      <div id="us-kline-chart" class="mkt-chart-placeholder">点击股票代码查看K线</div>
    </div>

    <div class="tab-pane" id="us-fundamental-pane">
      <div id="us-fundamental-content" class="mkt-empty">点击股票代码查看基本面</div>
    </div>
  </main>

  <!-- ═══ RIGHT RAIL: Binance Assets + Details ═══ -->
  <aside class="mkt-rail-right" aria-label="美股详情">
    <div class="mkt-card">
      <div class="mkt-card-head">币安美股资产</div>
      <div class="mkt-card-body">
        <div id="us-binance-assets" class="mkt-detail-placeholder">加载中...</div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">股票详情</div>
      <div class="mkt-card-body">
        <div id="us-detail-summary" class="mkt-detail-placeholder">点击股票代码查看详情</div>
        <div id="us-detail-content" style="display:none"></div>
      </div>
    </div>

    <div class="mkt-card">
      <div class="mkt-card-head">最近搜索</div>
      <div class="mkt-card-body">
        <div id="us-recent-searches" class="mkt-detail-placeholder">暂无</div>
      </div>
    </div>
  </aside>

</div>
</div>
